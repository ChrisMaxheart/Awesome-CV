name: Build CV PDF

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the pushed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Remove the previous PDF
        run: rm -f examples/cv.pdf

      - name: Compile CV with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: cv.tex
          working_directory: examples
          latexmk_use_xelatex: true
          texlive_version: 2025

      - name: Upload the generated PDF
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf-${{ github.sha }}
          path: examples/cv.pdf
          if-no-files-found: error

      - name: Commit the refreshed PDF
        env:
          CV_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- examples/cv.pdf
          if git diff --cached --quiet; then
            echo "The committed PDF is already up to date."
            exit 0
          fi
          git fetch origin "refs/heads/$CV_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "A newer push exists; its workflow will regenerate the PDF."
            exit 0
          fi
          git commit -m "Rebuild CV PDF"
          git push origin "HEAD:refs/heads/$CV_BRANCH"
